# NOTE::
# The services, settings and environment setup in this compose file is for DEVELOPMENT ONLY!
#
# It is intended to run the Apollo server in an "offline" mode. All data will be mocked.
#
networks:
  # This app's local network
  dmptool-api-network:
    driver: bridge
  # Access to the DMP Tool Rails app's MySQL DB
  dmptool-network:
    external: true

services:
  # We use LocalStack to mock AWS services. We are using it to mock the DynamoDB
  # table used to store the maDMP versions of Plans.
  #
  # See the ./localstack-setup/init-aws.sh script for more details.
  #
  # Note: that because we are using the free version of LocalStack, the DynamoDB
  #       table, Lambda Function and SQS Queues do not persist between restarts.
  localstack-api:
    image: "localstack/localstack"
    container_name: localstack-api
    networks:
      - dmptool-api-network
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - SERVICES=logs,events,dynamodb,ssm
    volumes:
      - "./docker/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Load local Lambda code and init-aws.sh startup scripts
      - "./localstack-setup:/etc/localstack/init/ready.d"
      - "./lambdas:/etc/lambda-code"

  rest-api:
    container_name: rest-api
    depends_on:
      localstack-api:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4060:4060"
    networks:
      - dmptool-api-network
    expose:
      - 4060
    env_file:
      - .env
    environment:
      - "AWS_ACCESS_KEY_ID=DUMMYIDEXAMPLE"
      - "AWS_SECRET_ACCESS_KEY=DUMMYEXAMPLEKEY"
      - "REGION=us-west-2"
      - "ENV=dev"
      - "NODE_ENV=development"
      - "PORT=4060"

      - "RDS_HOST=dmptool-mysql"
      - "RDS_PORT=3306"
      - "RDS_USERNAME=dmpuser"
      - "RDS_PASSWORD=abcdefghij"
      - "RDS_DATABASE=dmp"

      - "DYNAMODB_ENDPOINT=http://localstack:4566"
      - "DYNAMODB_TABLE_NAME=localDMPTable"
      - "MAX_ATTEMPTS=3"

      - "EZID_BASE_URL=https://doi.org"

      # Using the Apollo server network's LocalStack endpoint
      - "SSM_ENDPOINT=http://localstack:4566"

    volumes:
      - ".:/app"
